<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5a6a7a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90D9"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1D9E75"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF9F27"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#2d323e"/>
    </linearGradient>

    <linearGradient id="vue-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#42b883"/>
      <stop offset="100%" stop-color="#35a06e"/>
    </linearGradient>

    <linearGradient id="composable-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#3a7bc8"/>
    </linearGradient>

    <linearGradient id="ui-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF9F27"/>
      <stop offset="100%" stop-color="#d98c1f"/>
    </linearGradient>

    <linearGradient id="scene-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8125E0"/>
      <stop offset="100%" stop-color="#6d1fc4"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>

    <filter id="shadow-lg" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1100" height="750" fill="url(#bg)" rx="12"/>

  <!-- 顶部标题栏 -->
  <rect x="0" y="0" width="1100" height="56" fill="url(#header-grad)" rx="12"/>
  <rect x="0" y="40" width="1100" height="16" fill="url(#header-grad)"/>

  <text x="550" y="36" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600" letter-spacing="2">
    前端代码架构总览
  </text>

  <text x="550" y="76" text-anchor="middle" fill="#8a93a8" font-size="12">
    Three.js 三维机械臂可视化 · Vue 3 + Vite 前端
  </text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 【顶部】数据入口层 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- 外部来源标注 -->
  <rect x="60" y="98" width="200" height="36" rx="18" fill="#e8ecf2" stroke="#d0d5dd"/>
  <text x="160" y="120" text-anchor="middle" fill="#5a6a7a" font-size="12">
    外部数据来源
  </text>

  <line x1="260" y1="116" x2="340" y2="116" stroke="#5a6a7a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- 两个来源 -->
  <rect x="340" y="98" width="170" height="36" rx="8" fill="#edf3ff" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="425" y="119" text-anchor="middle" fill="#4A90D9" font-size="12" font-weight="600">
    C# 宿主 → PostWebMessageAsString
  </text>

  <rect x="530" y="98" width="150" height="36" rx="8" fill="#edf3ff" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="605" y="119" text-anchor="middle" fill="#4A90D9" font-size="12" font-weight="600">
    SignalR 直连
  </text>

  <rect x="700" y="98" width="120" height="36" rx="8" fill="#f0eef5" stroke="#8125E0" stroke-width="1.5"/>
  <text x="760" y="119" text-anchor="middle" fill="#8125E0" font-size="12" font-weight="600">
    浏览器控制台
  </text>

  <!-- 箭头：入口 → App.vue -->
  <line x1="160" y1="134" x2="160" y2="170" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- App.vue 入口组件 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="60" y="172" width="200" height="64" rx="10" fill="url(#vue-card)" filter="url(#shadow-lg)"/>
  <text x="160" y="196" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">📦 App.vue</text>
  <text x="160" y="216" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">消息总入口</text>
  <text x="160" y="230" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">window.onCSharpMessage</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- RobotViewer.vue - 核心枢纽 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- 箭头：App.vue → RobotViewer -->
  <line x1="260" y1="204" x2="380" y2="204" stroke="#4A90D9" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="380" y="155" width="280" height="100" rx="12" fill="url(#vue-card)" filter="url(#shadow-lg)"/>
  <text x="520" y="180" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">🎯 RobotViewer.vue</text>
  <text x="520" y="200" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">核心枢纽 · 所有模块的组装者</text>
  <text x="520" y="218" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="10">defineExpose 对外暴露三个接口</text>
  <text x="520" y="234" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="10">
    onArmPoseReceived / onHoleDataReceived / addHoles
  </text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 用户看到的界面 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="740" y="155" width="290" height="100" rx="12" fill="#1a1d23" filter="url(#shadow-lg)"/>
  <text x="885" y="180" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">🖥️ 用户看到的界面</text>

  <!-- 场景标注 -->
  <rect x="755" y="192" width="125" height="24" rx="4" fill="#2d323e"/>
  <text x="817" y="208" text-anchor="middle" fill="#9aa3b5" font-size="10">三维场景 (Three.js)</text>

  <!-- 统计面板 -->
  <rect x="890" y="192" width="125" height="24" rx="4" fill="#2d323e"/>
  <text x="952" y="208" text-anchor="middle" fill="#9aa3b5" font-size="10">右上角统计面板</text>

  <!-- 调试面板 -->
  <rect x="755" y="222" width="125" height="24" rx="4" fill="#2d323e"/>
  <text x="817" y="238" text-anchor="middle" fill="#9aa3b5" font-size="10">调试面板 (可隐藏)</text>

  <!-- 孔洞弹窗 -->
  <rect x="890" y="222" width="125" height="24" rx="4" fill="#2d323e"/>
  <text x="952" y="238" text-anchor="middle" fill="#9aa3b5" font-size="10">点击孔洞 → 详情弹窗</text>

  <!-- 箭头：RobotViewer → 用户界面 -->
  <line x1="660" y1="205" x2="738" y2="205" stroke="#5a6a7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 数据流：App.vue 分发消息 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- 从 App.vue 向下的三条路径 -->
  <line x1="120" y1="236" x2="120" y2="310" stroke="#4A90D9" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="170" y1="236" x2="170" y2="310" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="215" y1="236" x2="215" y2="310" stroke="#EF9F27" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- 路径标签 -->
  <text x="90" y="270" fill="#4A90D9" font-size="10" font-weight="600">type:"pose"</text>
  <text x="153" y="270" fill="#1D9E75" font-size="10" font-weight="600">type:"holes"</text>
  <text x="195" y="270" fill="#EF9F27" font-size="10" font-weight="600">type:"addHoles"</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- composables 层 — 三个核心模块 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- 模块 1: useArmController -->
  <rect x="40" y="315" width="220" height="200" rx="10" fill="url(#composable-card)" filter="url(#shadow)"/>
  <text x="150" y="340" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">🤖 useArmController.js</text>
  <line x1="60" y1="352" x2="240" y2="352" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <text x="60" y="372" fill="rgba(255,255,255,0.85)" font-size="11">职责：机械臂骨骼驱动</text>

  <text x="60" y="395" fill="rgba(255,255,255,0.6)" font-size="10">• loadArm(url) → 加载 glTF 模型</text>
  <text x="60" y="412" fill="rgba(255,255,255,0.6)" font-size="10">• updatePose(pose) → 接收关节角度</text>
  <text x="60" y="429" fill="rgba(255,255,255,0.6)" font-size="10">• 插值循环 lerp → 平滑驱动骨骼</text>
  <text x="60" y="446" fill="rgba(255,255,255,0.6)" font-size="10">• getFlangeCartesian() → J6 末端坐标</text>

  <text x="60" y="468" fill="rgba(255,255,255,0.5)" font-size="9">可配置项：</text>
  <text x="60" y="484" fill="rgba(255,255,255,0.5)" font-size="9">BONE_NAMES (骨骼名) / BONE_AXIS (旋转轴)</text>
  <text x="60" y="500" fill="rgba(255,255,255,0.5)" font-size="9">BASE_POS_AXIS (底座位移) / LERP_FACTOR (插值系数)</text>

  <!-- 模块 2: useTubeManager -->
  <rect x="285" y="315" width="220" height="200" rx="10" fill="url(#scene-card)" filter="url(#shadow)"/>
  <text x="395" y="340" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">🔴 useTubeManager.js</text>
  <line x1="305" y1="352" x2="485" y2="352" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <text x="305" y="372" fill="rgba(255,255,255,0.85)" font-size="11">职责：孔洞渲染与统计</text>

  <text x="305" y="395" fill="rgba(255,255,255,0.6)" font-size="10">• addHoles(holes) → 全量添加孔洞</text>
  <text x="305" y="412" fill="rgba(255,255,255,0.6)" font-size="10">• appendHoles(holes) → 增量追加</text>
  <text x="305" y="429" fill="rgba(255,255,255,0.6)" font-size="10">• removeHoles(ids) → 按 ID 删除</text>
  <text x="305" y="446" fill="rgba(255,255,255,0.6)" font-size="10">• setHoleStatus() → 更新颜色</text>

  <text x="305" y="468" fill="rgba(255,255,255,0.5)" font-size="9">内部状态：</text>
  <text x="305" y="484" fill="rgba(255,255,255,0.5)" font-size="9">holeMap (实例ID映射)</text>
  <text x="305" y="500" fill="rgba(255,255,255,0.5)" font-size="9">_allHoles (全量列表)</text>

  <!-- 模块 3: useSceneManager -->
  <rect x="530" y="315" width="200" height="200" rx="10" fill="#3d3d5c" filter="url(#shadow)"/>
  <text x="630" y="340" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">🎬 useSceneManager.js</text>
  <line x1="550" y1="352" x2="710" y2="352" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <text x="550" y="372" fill="rgba(255,255,255,0.85)" font-size="11">职责：Three.js 场景管理</text>

  <text x="550" y="395" fill="rgba(255,255,255,0.6)" font-size="10">• initScene(container)</text>
  <text x="550" y="412" fill="rgba(255,255,255,0.6)" font-size="10">• scene (ref)</text>
  <text x="550" y="429" fill="rgba(255,255,255,0.6)" font-size="10">• camera (ref)</text>
  <text x="550" y="446" fill="rgba(255,255,255,0.6)" font-size="10">• renderer (ref)</text>
  <text x="550" y="468" fill="rgba(255,255,255,0.6)" font-size="10">• disposeScene()</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 辅助模块 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- useRaycaster -->
  <rect x="40" y="535" width="200" height="70" rx="8" fill="#e8ecf2" stroke="#d0d5dd"/>
  <text x="140" y="558" text-anchor="middle" fill="#3d3d5c" font-size="13" font-weight="600">🖱️ useRaycaster.js</text>
  <text x="55" y="577" fill="#5a6a7a" font-size="10">鼠标点击拾取孔洞</text>
  <text x="55" y="593" fill="#5a6a7a" font-size="10">点击 -> 弹出孔洞详情弹窗</text>

  <!-- useDebugManager -->
  <rect x="265" y="535" width="220" height="70" rx="8" fill="url(#ui-card)" filter="url(#shadow)"/>
  <text x="375" y="558" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">🔧 useDebugManager.js</text>
  <text x="280" y="577" fill="rgba(255,255,255,0.8)" font-size="10">调试面板的数据逻辑</text>
  <text x="280" y="593" fill="rgba(255,255,255,0.8)" font-size="10">骨骼可视化 / 关节控制 / 调试孔洞</text>

  <!-- DebugPanel.vue -->
  <rect x="510" y="535" width="220" height="70" rx="8" fill="url(#ui-card)" filter="url(#shadow)"/>
  <text x="620" y="558" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">📋 DebugPanel.vue</text>
  <text x="525" y="577" fill="rgba(255,255,255,0.8)" font-size="10">调试面板 UI 组件</text>
  <text x="525" y="593" fill="rgba(255,255,255,0.8)" font-size="10">输入表单 / 调试孔洞控制</text>

  <!-- 连接线：useDebugManager ↔ DebugPanel -->
  <line x1="485" y1="570" x2="508" y2="570" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- 连接线：RobotViewer → Raycaster -->
  <line x1="520" y1="255" x2="140" y2="315" stroke="#5a6a7a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="140" y1="315" x2="140" y2="533" stroke="#5a6a7a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- 连接线：RobotViewer → DebugManager -->
  <line x1="520" y1="255" x2="375" y2="315" stroke="#EF9F27" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 底部说明区 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="40" y="625" width="970" height="100" rx="10" fill="#ffffff" stroke="#e0e3e8" filter="url(#shadow)"/>

  <text x="60" y="650" fill="#1a1d23" font-size="12" font-weight="600">📌 数据流说明</text>

  <text x="60" y="672" fill="#5a6a7a" font-size="11">
    1. 外部数据通过 WebView2 Bridge 或 SignalR 进入 App.vue 的 window.onCSharpMessage
  </text>
  <text x="60" y="690" fill="#5a6a7a" font-size="11">
    2. App.vue 根据消息 type 分发：pose → 驱动骨骼 / holes → 更新孔洞状态 / addHoles → 添加孔洞位置
  </text>
  <text x="60" y="708" fill="#5a6a7a" font-size="11">
    3. 所有数据统一汇聚到 RobotViewer.vue，再分派给对应的 composable 处理
  </text>
  <text x="60" y="720" fill="#8a93a8" font-size="10">
    颜色标识：🔵 数据入口  🟢 孔洞数据  🟠 调试工具  🟣 场景渲染
  </text>

  <!-- 图例 -->
  <rect x="790" y="640" width="12" height="12" rx="3" fill="#4A90D9"/>
  <text x="808" y="651" fill="#5a6a7a" font-size="10">入口</text>
  <rect x="860" y="640" width="12" height="12" rx="3" fill="#1D9E75"/>
  <text x="878" y="651" fill="#5a6a7a" font-size="10">孔洞</text>
  <rect x="930" y="640" width="12" height="12" rx="3" fill="#EF9F27"/>
  <text x="948" y="651" fill="#5a6a7a" font-size="10">调试</text>

  <rect x="790" y="660" width="12" height="12" rx="3" fill="#8125E0"/>
  <text x="808" y="671" fill="#5a6a7a" font-size="10">场景</text>
  <rect x="860" y="660" width="12" height="12" rx="3" fill="#42b883"/>
  <text x="878" y="671" fill="#5a6a7a" font-size="10">Vue 组件</text>

</svg>
