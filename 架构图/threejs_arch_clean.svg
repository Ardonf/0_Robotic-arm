  <rect x="40" y="728" width="224" height="72" rx="8" fill="#1a1d23" filter="url(#shadow)"/>
  <text x="152" y="750" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">🌐 三维场景</text>
  <text x="152" y="767" text-anchor="middle" fill="#9aa3b5" font-size="10">机械臂骨骼动画</text>
