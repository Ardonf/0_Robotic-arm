<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5a6a7a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90D9"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1D9E75"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF9F27"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8125E0"/>
    </marker>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>

    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#2d323e"/>
    </linearGradient>

    <linearGradient id="layer-border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e3e8"/>
      <stop offset="100%" stop-color="#d0d5dd"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.10"/>
    </filter>
    <filter id="shadow-lg" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1100" height="820" fill="url(#bg)" rx="12"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="1100" height="52" fill="url(#header)" rx="12"/>
  <rect x="0" y="38" width="1100" height="14" fill="url(#header)"/>
  <text x="550" y="33" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600" letter-spacing="2">
    前端代码架构总览（实际项目）
  </text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 第 1 层：数据入口 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="36" y="74" width="1028" height="20" rx="4" fill="none" stroke="#d0d5dd" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="48" y="88" fill="#8a93a8" font-size="10" font-weight="600">第 1 层 · 数据入口</text>

  <!-- 外部来源 -->
  <rect x="48" y="102" width="120" height="32" rx="16" fill="#e8ecf2" stroke="#d0d5dd"/>
  <text x="108" y="122" text-anchor="middle" fill="#5a6a7a" font-size="11">外部数据来源</text>

  <line x1="168" y1="118" x2="216" y2="118" stroke="#5a6a7a" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <rect x="218" y="100" width="175" height="36" rx="6" fill="#e2f0ff" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="305" y="118" text-anchor="middle" fill="#4A90D9" font-size="11" font-weight="600" letter-spacing="0.3">
    C# 宿主（WebView2 Bridge）
  </text>
  <text x="305" y="130" text-anchor="middle" fill="#7ab3e8" font-size="9">PostWebMessageAsString(json)</text>

  <rect x="418" y="100" width="155" height="36" rx="6" fill="#e2f0ff" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="495" y="118" text-anchor="middle" fill="#4A90D9" font-size="11" font-weight="600">前端直连 SignalR Hub</text>
  <text x="495" y="130" text-anchor="middle" fill="#7ab3e8" font-size="9">@microsoft/signalr</text>

  <!-- 虚线分隔 -->
  <line x1="590" y1="118" x2="620" y2="118" stroke="#d0d5dd" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="622" y="100" width="130" height="36" rx="6" fill="#f0eef5" stroke="#8125E0" stroke-width="1.5"/>
  <text x="687" y="118" text-anchor="middle" fill="#8125E0" font-size="11" font-weight="600">浏览器控制台</text>
  <text x="687" y="130" text-anchor="middle" fill="#a892d9" font-size="9">手动模拟调试</text>

  <!-- 箭头：外部 → App.vue -->
  <path d="M 108 134 L 108 168" stroke="#5a6a7a" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 第 2 层：Vue 组件层 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="36" y="176" width="1028" height="20" rx="4" fill="none" stroke="#d0d5dd" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="48" y="190" fill="#8a93a8" font-size="10" font-weight="600">第 2 层 · Vue 组件层（3D 艺术家无需修改）</text>

  <!-- App.vue -->
  <rect x="48" y="204" width="175" height="64" rx="8" fill="#42b883" filter="url(#shadow)"/>
  <text x="135" y="226" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">📦 App.vue</text>
  <text x="135" y="243" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">消息总入口</text>
  <text x="135" y="257" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-size="9">window.onCSharpMessage</text>

  <!-- App.vue → RobotViewer 连线 -->
  <line x1="223" y1="236" x2="300" y2="236" stroke="#42b883" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RobotViewer.vue -->
  <rect x="302" y="200" width="290" height="72" rx="8" fill="#42b883" filter="url(#shadow-lg)"/>
  <text x="447" y="222" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">🎯 RobotViewer.vue</text>
  <text x="447" y="239" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10">核心枢纽 · 组装所有模块</text>
  <text x="447" y="254" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="9">defineExpose: onArmPoseReceived / onHoleDataReceived / addHoles</text>
  <text x="447" y="266" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="8">内部: updatePose + Object.assign(jointForm) 同步调试面板</text>

  <!-- 其他 Vue 组件 -->
  <rect x="630" y="200" width="175" height="72" rx="8" fill="#42b883" filter="url(#shadow)"/>
  <text x="717" y="222" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">📋 DebugPanel.vue</text>
  <text x="717" y="239" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">调试面板 UI 组件</text>
  <text x="717" y="254" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9">关节控制 / 骨骼可视化</text>
  <text x="717" y="266" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9">孔洞调试 / J6 坐标显示</text>

  <rect x="835" y="200" width="175" height="72" rx="8" fill="#42b883" filter="url(#shadow)"/>
  <text x="922" y="222" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">🔍 其他组件</text>
  <text x="922" y="239" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">DebugModePanel.vue</text>
  <text x="922" y="254" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9">ManualModePanel.vue</text>

  <!-- RobotViewer → DebugPanel 连线 -->
  <path d="M 592 224 L 628 224" stroke="#42b883" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- App.vue 到 composables 的三条消息分发路径 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <line x1="90" y1="268" x2="90" y2="328" stroke="#4A90D9" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="148" y1="268" x2="148" y2="328" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="200" y1="268" x2="200" y2="328" stroke="#EF9F27" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <text x="72" y="300" fill="#4A90D9" font-size="9" font-weight="600">type:"pose"</text>
  <text x="130" y="300" fill="#1D9E75" font-size="9" font-weight="600">type:"holes"</text>
  <text x="175" y="300" fill="#EF9F27" font-size="9" font-weight="600">type:"addHoles"</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 第 3 层：composables 逻辑层 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="36" y="336" width="1028" height="20" rx="4" fill="none" stroke="#d0d5dd" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="48" y="350" fill="#8a93a8" font-size="10" font-weight="600">第 3 层 · Composables 逻辑层（3D 艺术家需要了解的配置项用 ⚙️ 标注）</text>

  <!-- useArmController -->
  <rect x="40" y="364" width="230" height="210" rx="10" fill="#4A90D9" filter="url(#shadow)"/>
  <text x="155" y="390" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">🤖 useArmController.js</text>
  <rect x="50" y="400" width="210" height="1" fill="rgba(255,255,255,0.2)"/>

  <text x="55" y="418" fill="rgba(255,255,255,0.85)" font-size="11">职责：加载 glTF + 骨骼驱动</text>

  <text x="55" y="438" fill="rgba(255,255,255,0.65)" font-size="10">• loadArm(url) → 加载模型</text>
  <text x="55" y="454" fill="rgba(255,255,255,0.65)" font-size="10">• updatePose(pose) → 接收关节角度</text>
  <text x="55" y="470" fill="rgba(255,255,255,0.65)" font-size="10">• 插值循环 → 平滑驱动骨骼旋转+位移</text>
  <text x="55" y="486" fill="rgba(255,255,255,0.65)" font-size="10">• getFlangeCartesian() → J6 末端坐标</text>

  <rect x="50" y="500" width="210" height="1" fill="rgba(255,255,255,0.15)"/>
  <text x="55" y="516" fill="rgba(255,255,255,0.75)" font-size="10" font-weight="600">⚙️ 3D 艺术家配置项：</text>
  <text x="55" y="534" fill="rgba(255,255,255,0.6)" font-size="9">BONE_NAMES — Blender 骨骼名称映射</text>
  <text x="55" y="549" fill="rgba(255,255,255,0.6)" font-size="9">BONE_AXIS — 每根骨骼旋转轴与方向</text>
  <text x="55" y="564" fill="rgba(255,255,255,0.6)" font-size="9">BASE_POS_AXIS — 底座位移方向</text>

  <!-- useTubeManager -->
  <rect x="290" y="364" width="230" height="210" rx="10" fill="#8125E0" filter="url(#shadow)"/>
  <text x="405" y="390" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">🔴 useTubeManager.js</text>
  <rect x="300" y="400" width="210" height="1" fill="rgba(255,255,255,0.2)"/>

  <text x="305" y="418" fill="rgba(255,255,255,0.85)" font-size="11">职责：孔洞批量渲染与统计</text>

  <text x="305" y="438" fill="rgba(255,255,255,0.65)" font-size="10">• addHoles(holes) → 全量添加（替换）</text>
  <text x="305" y="454" fill="rgba(255,255,255,0.65)" font-size="10">• appendHoles(holes) → 增量追加</text>
  <text x="305" y="470" fill="rgba(255,255,255,0.65)" font-size="10">• removeHoles(ids) → 按 ID 删除</text>
  <text x="305" y="486" fill="rgba(255,255,255,0.65)" font-size="10">• setHoleStatus() → 更新颜色+统计</text>

  <rect x="300" y="500" width="210" height="1" fill="rgba(255,255,255,0.15)"/>
  <text x="305" y="516" fill="rgba(255,255,255,0.7)" font-size="10">渲染策略：</text>
  <text x="305" y="534" fill="rgba(255,255,255,0.6)" font-size="9">标准孔洞 → InstancedMesh（高性能）</text>
  <text x="305" y="549" fill="rgba(255,255,255,0.6)" font-size="9">调试孔洞 → 独立 Mesh（自定义尺寸/颜色）</text>
  <text x="305" y="564" fill="rgba(255,255,255,0.6)" font-size="9">两者统一计入 holeStats</text>

  <!-- useSceneManager -->
  <rect x="540" y="364" width="200" height="210" rx="10" fill="#3d3d5c" filter="url(#shadow)"/>
  <text x="640" y="390" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">🎬 useSceneManager.js</text>
  <rect x="550" y="400" width="180" height="1" fill="rgba(255,255,255,0.2)"/>

  <text x="550" y="418" fill="rgba(255,255,255,0.85)" font-size="11">职责：Three.js 场景生命周期</text>
  <text x="550" y="440" fill="rgba(255,255,255,0.65)" font-size="10">• initScene(container)</text>
  <text x="550" y="456" fill="rgba(255,255,255,0.65)" font-size="10">• scene (ref)</text>
  <text x="550" y="472" fill="rgba(255,255,255,0.65)" font-size="10">• camera / renderer (ref)</text>
  <text x="550" y="488" fill="rgba(255,255,255,0.65)" font-size="10">• disposeScene()</text>

  <rect x="550" y="500" width="180" height="1" fill="rgba(255,255,255,0.15)"/>
  <text x="550" y="518" fill="rgba(255,255,255,0.7)" font-size="10">3D 艺术家无需修改</text>

  <!-- useRaycaster -->
  <rect x="760" y="364" width="150" height="100" rx="8" fill="#e8ecf2" stroke="#c0c5ce" filter="url(#shadow)"/>
  <text x="835" y="388" text-anchor="middle" fill="#3d3d5c" font-size="13" font-weight="600">🖱️ useRaycaster.js</text>
  <text x="770" y="407" fill="#5a6a7a" font-size="10">鼠标点击拾取孔洞</text>
  <text x="770" y="423" fill="#5a6a7a" font-size="10">点击 → 弹出孔洞详情弹窗</text>
  <text x="770" y="439" fill="#5a6a7a" font-size="10">hover 高亮</text>

  <!-- useDebugManager -->
  <rect x="760" y="478" width="150" height="96" rx="8" fill="#EF9F27" filter="url(#shadow)"/>
  <text x="835" y="500" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">🔧 useDebugManager.js</text>
  <text x="770" y="517" fill="rgba(255,255,255,0.8)" font-size="10">调试面板数据逻辑</text>
  <text x="770" y="533" fill="rgba(255,255,255,0.8)" font-size="10">骨骼可视化</text>
  <text x="770" y="549" fill="rgba(255,255,255,0.8)" font-size="10">关节控制 / 调试孔洞</text>

  <!-- DebugManager ↔ DebugPanel 连线 -->
  <path d="M 835 478 L 835 300 L 800 300 L 800 274" stroke="#EF9F27" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow-orange)"/>

  <!-- 连接 RobotViewer 到各 composable -->
  <path d="M 447 272 L 447 324" stroke="#5a6a7a" stroke-width="1" fill="none"/>
  <path d="M 447 324 L 155 324 L 155 362" stroke="#5a6a7a" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 447 324 L 405 324 L 405 362" stroke="#5a6a7a" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 447 324 L 640 324 L 640 362" stroke="#5a6a7a" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 447 324 L 835 324 L 835 362" stroke="#5a6a7a" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
