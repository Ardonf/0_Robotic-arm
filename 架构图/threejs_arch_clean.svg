  <!-- ═══════════════════════════════════════════════════════════════ -->

  <rect x="36" y="596" width="1028" height="20" rx="4" fill="none" stroke="#d0d5dd" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="48" y="610" fill="#8a93a8" font-size="10" font-weight="600">第 4 层 · 构建 / 测试 / 静态资源</text>

  <rect x="40" y="624" width="150" height="56" rx="8" fill="#e8ecf2" stroke="#d0d5dd"/>
  <text x="115" y="646" text-anchor="middle" fill="#3d3d5c" font-size="13" font-weight="600">⚡ vite.config.js</text>
  <text x="115" y="665" text-anchor="middle" fill="#5a6a7a" font-size="10">Vite 构建配置</text>

  <rect x="210" y="624" width="150" height="56" rx="8" fill="#e8ecf2" stroke="#d0d5dd"/>
  <text x="285" y="646" text-anchor="middle" fill="#3d3d5c" font-size="13" font-weight="600">📦 package.json</text>
  <text x="285" y="665" text-anchor="middle" fill="#5a6a7a" font-size="10">Vue 3 / Three.js / Vite</text>

  <rect x="380" y="624" width="150" height="56" rx="8" fill="#e8ecf2" stroke="#d0d5dd"/>
  <text x="455" y="646" text-anchor="middle" fill="#3d3d5c" font-size="13" font-weight="600">🧪 tests/</text>
  <text x="455" y="665" text-anchor="middle" fill="#5a6a7a" font-size="10">27 个单元测试（vitest）</text>

  <rect x="550" y="624" width="150" height="56" rx="8" fill="#e8ecf2" stroke="#d0d5dd"/>
  <text x="625" y="646" text-anchor="middle" fill="#3d3d5c" font-size="13" font-weight="600">🎨 public/models/</text>
  <text x="625" y="665" text-anchor="middle" fill="#5a6a7a" font-size="10">robot_arm.glb 模型文件</text>

  <rect x="720" y="624" width="170" height="56" rx="8" fill="#e8ecf2" stroke="#d0d5dd"/>
  <text x="805" y="646" text-anchor="middle" fill="#3d3d5c" font-size="13" font-weight="600">📄 index.html</text>
  <text x="805" y="665" text-anchor="middle" fill="#5a6a7a" font-size="10">Vite 入口 HTML</text>

